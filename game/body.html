<div id="app">
  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div id="hover">Drag to scroll the map.</div>
  </div>
  <aside id="side">
    <h1>Ashen Crowns</h1>
    <div id="turnbar"></div>
    <canvas id="mini" width="220" height="160"></canvas>
    <div id="treasury"></div>
    <div id="btns">
      <button type="button" id="bNext">Next army</button>
      <button type="button" id="bEnd" class="primary">End turn</button>
      <button type="button" id="bHelp" aria-label="How to play">?</button>
    </div>
    <div id="panel"></div>
    <ul id="log"></ul>
  </aside>
</div>
<div id="modal" hidden><div id="mbox" role="dialog" aria-modal="true"></div></div>
