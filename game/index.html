<style>
/* Layout: a war table. The map fills the left; a slate command rail sits on the right (below on phones). */
:root {
  color-scheme: dark;
  --ink: #12161a;        /* table edge, deepest ground */
  --slate: #1c2329;      /* rail surface */
  --slate-2: #27313a;    /* raised controls */
  --line: #3a4753;       /* hairlines */
  --bone: #e9e4d2;       /* primary text */
  --dust: #9aa5a8;       /* secondary text */
  --brass: #f3cf5b;      /* accent: selection, primary action */
  --good: #7fd08a; --bad: #ff8a7a;

  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;

html, body { height: 100%; }
body { background: var(--ink); color: var(--bone); font: 15px/1.4 var(--body); overflow: hidden; }
#app { height: 100%; display: flex; }
#mapwrap { flex: 1 1 auto; min-width: 0; position: relative; display: flex; flex-direction: column; }
#map { flex: 1 1 auto; min-height: 0; width: 100%; display: block; touch-action: none; cursor: crosshair; image-rendering: pixelated; }
#hover { flex: none; min-height: 2.2em; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  background: var(--slate); border-top: 1px solid var(--line); color: var(--dust); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#side { flex: none; width: 316px; background: var(--slate); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px;
  padding-block: 12px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
#side > * { flex: none; }
#side h1 { font: 400 24px/1 var(--display); letter-spacing: .04em; margin: 0; color: var(--brass); }
#turnbar { display: flex; justify-content: space-between; font-size: 14px; color: var(--dust); }
#turnbar .who { font-weight: 700; }
#mini { width: 100%; height: auto; image-rendering: pixelated; border: 1px solid var(--line); cursor: pointer; }
#treasury { font-variant-numeric: tabular-nums; font-size: 14px; }
.coin { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--brass); box-shadow: inset -2px -2px 0 #a8862a; margin-right: 6px; }
.muted { color: var(--dust); font-weight: 400; }
#panel { display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
#panel h2, #mbox h2 { font: 400 19px/1.1 var(--display); letter-spacing: .03em; margin: 4px 0 0; text-wrap: balance; }
#panel h3, #mbox h3 { font: 700 12px/1.2 var(--body); letter-spacing: .09em; text-transform: uppercase; margin: 4px 0 0; color: var(--dust); }
#panel p, #mbox p { margin: 0; }
.hint { color: var(--dust); font-size: 13px; }
.units, .prod { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
button { font: inherit; color: var(--bone); background: var(--slate-2); border: 1px solid var(--line); border-radius: 3px; padding: 7px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--dust); }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--brass); color: var(--ink); border-color: var(--brass); font-weight: 700; }
button small { color: var(--dust); font-size: 12px; }
button.primary small { color: inherit; }
.unit { display: grid; grid-template-columns: 40px 1fr; column-gap: 8px; align-items: center; text-align: left; padding: 5px 6px; min-width: 0; }
.unit img { grid-row: span 3; width: 40px; height: 40px; align-self: start; }
.unit .un { font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unit .us { font-size: 11px; color: var(--dust); font-variant-numeric: tabular-nums; }
.unit.hero { grid-column: 1 / -1; border-left: 4px solid var(--brass); background: #2f3540; }
.advance, .quest { font-size: 14px; }
.quest { border-left: 3px solid var(--brass); padding-left: 8px; }
.unit.on { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
.unit:disabled { opacity: 1; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
#btns { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
#log { list-style: none; margin: 0; padding: 8px 0 0; border-top: 1px solid var(--line); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
#modal { position: fixed; inset: 0; background: rgba(8, 10, 12, .78); display: flex; align-items: center; justify-content: center;

#mbox { background: var(--slate); border: 1px solid var(--line); border-top: 3px solid var(--brass); max-width: 760px; width: 100%; max-height: 100%; overflow-y: auto;

.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dust); }
.logo { font: 400 clamp(38px, 8vw, 64px)/0.95 var(--display); letter-spacing: .03em; margin: 0; color: var(--brass); text-shadow: 0 3px 0 #6b5516; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.fcard img { width: 56px; height: 56px; }
.fcard b { align-self: center; color: var(--fc); font: 400 18px/1.1 var(--display); }
.fcard span { grid-column: 1 / -1; font-size: 13px; }
.offer { display: flex; gap: 14px; align-items: center; }
.offer img { width: 72px; height: 72px; flex: none; }
.battle { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.bside { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; margin-top: 6px; }
.bu { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 3px; background: var(--slate-2); border: 1px solid var(--line); text-align: center; min-width: 0; }
.bu img { width: 48px; height: 48px; }
.bu .un { font-size: 11px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bu .us { font-size: 11px; color: var(--dust); }
.bu.act { border-color: var(--brass); }
.bu.hit { background: #6b2b24; }
.bu.dead { opacity: .28; filter: grayscale(1); }
.pips { display: flex; gap: 2px; }
.pips i { width: 7px; height: 7px; background: var(--good); }
.pips i.lost { background: #4a2a28; }
.bonus { font-size: 12px; color: var(--dust); min-height: 1.4em; }
.dice { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; text-align: center; }
.die { flex: none; width: 44px; height: 44px; display: grid; place-items: center; font: 700 20px/1 Georgia, serif; font-variant-numeric: tabular-nums; background: #e9e4d2; color: #15110d; border: 2px solid #15110d; border-radius: 6px; box-shadow: inset -3px -3px 0 rgba(0,0,0,.18); }
.die.ok { background: var(--good); }
.die.miss { background: #b9b3a2; color: #5f5b50; }
.bres { font-weight: 700; min-height: 1.4em; }
.bres.good { color: var(--good); } .bres.bad { color: var(--bad); }
.help { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; max-width: 65ch; }
@media (max-width: 760px) {

  #mini { max-width: 260px; }
  .battle, .fgrid { grid-template-columns: 1fr; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Deterministic map builder: the same seed always yields the same land. */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function valueNoise(w, h, cell, rng) {
  const gw = Math.ceil(w / cell) + 2, gh = Math.ceil(h / cell) + 2, g = [];
  for (let i = 0; i < gw * gh; i++) g.push(rng());
  const out = new Float32Array(w * h);
  const sm = t => t * t * (3 - 2 * t);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const fx = x / cell, fy = y / cell, x0 = Math.floor(fx), y0 = Math.floor(fy);
    const tx = sm(fx - x0), ty = sm(fy - y0);
    const a = g[y0 * gw + x0], b = g[y0 * gw + x0 + 1], c = g[(y0 + 1) * gw + x0], d = g[(y0 + 1) * gw + x0 + 1];
    out[y * w + x] = (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
  }
  return out;
}

class Heap {
  constructor() { this.k = []; this.v = []; }
  get size() { return this.k.length; }
  push(key, val) {
    const k = this.k, v = this.v; let i = k.length; k.push(key); v.push(val);
    while (i > 0) { const p = (i - 1) >> 1; if (k[p] <= k[i]) break;
      [k[p], k[i]] = [k[i], k[p]]; [v[p], v[i]] = [v[i], v[p]]; i = p; }
  }
  pop() {
    const k = this.k, v = this.v, rk = k[0], rv = v[0], lk = k.pop(), lv = v.pop();
    if (k.length) { k[0] = lk; v[0] = lv; let i = 0; const n = k.length;
      for (;;) { let m = i; const l = 2 * i + 1, r = l + 1;
        if (l < n && k[l] < k[m]) m = l; if (r < n && k[r] < k[m]) m = r; if (m === i) break;
        [k[m], k[i]] = [k[i], k[m]]; [v[m], v[i]] = [v[i], v[m]]; i = m; } }
    return [rk, rv];

  cv.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, pan: false, btn: e.button }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (down) { const dx = e.clientX - down.x, dy = e.clientY - down.y; if (down.pan || Math.hypot(dx, dy) > 7) { down.pan = true; cam.x = down.cx - dx; cam.y = down.cy - dy; clampCam(); return; } }
    if (!G) return; const t = tileOf(e); if (!inb(t.x, t.y)) return;
    if (!hover || hover.x !== t.x || hover.y !== t.y) { hover = t; updatePreview(); }
  });
  cv.addEventListener('pointerup', e => { const d = down; down = null; if (!d || d.pan) return; const t = tileOf(e); clickTile(t.x, t.y, d.btn === 2); });
  cv.addEventListener('pointercancel', () => { down = null; });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('wheel', e => { e.preventDefault(); cam.x += e.deltaX; cam.y += e.deltaY; clampCam(); }, { passive: false });
  mini.addEventListener('pointerdown', e => { const r = mini.getBoundingClientRect(); centerOn(Math.floor((e.clientX - r.left) / r.width * MAP_W), Math.floor((e.clientY - r.top) / r.height * MAP_H)); });
  window.addEventListener('resize', resize);
  window.addEventListener('keydown', e => {
    if (!$('modal').hidden || !G) return;
    const k = e.key.toLowerCase();
    if (k === 'n' && !busy) nextArmy(); else if (k === 'e' && !busy) endTurn(); else if (k === 'escape') deselect();
    else if (k.startsWith('arrow')) { e.preventDefault(); cam.x += k === 'arrowleft' ? -TS * 2 : k === 'arrowright' ? TS * 2 : 0; cam.y += k === 'arrowup' ? -TS * 2 : k === 'arrowdown' ? TS * 2 : 0; clampCam(); }
  });
  async function endTurn() { if (busy || G.cur !== HUMAN) return; busy = true; sel = null; selCity = null; preview = null; refresh(); await runTurns(); }
  $('bEnd').addEventListener('click', endTurn);
  $('bNext').addEventListener('click', () => { if (!busy) nextArmy(); });
  $('bHelp').addEventListener('click', help);
  $('panel').addEventListener('click', e => {
    if (busy || !G) return;
    const b = e.target.closest('button'); if (!b) return; const d = b.dataset, s = sel && stackById(sel.stackId);
    if (d.perk && s) { const h = s.units.find(u => u.id === +d.hero); if (h) applyPerk(h, d.perk); sel.dm = null; }
    else if (d.quest && s) {
      const h = s.units.find(u => u.id === +d.quest), q = h && offerQuest(s, h);
      if (q) { modal(`<h2>A quest for ${esc(h.hero.name)}</h2><p>${esc(q.text)}</p><p class="muted">Reward: ${QUEST_REWARDS[q.reward]}. A hero carries one quest at a time.</p><div class="row"><button type="button" class="primary" data-a="ok">Accept</button></div>`); waitClick('button[data-a]').then(closeModal); }
    }
    else if (d.unit && s) { const id = +d.unit; if (sel.ids.has(id)) sel.ids.delete(id); else sel.ids.add(id); sel.dm = null; }
    else if (d.spell && s) { const h = s.units.find(u => u.id === +d.hero); if (h && !castSpell(s, h, d.spell)) setHoverText('That spell cannot be cast now.'); if (SPELLS.find(q => q.key === d.spell).unit) selectStack(s); sel.dm = null; }
    else if (d.search && s) {
      const h = s.units.find(u => u.id === +d.search), r = h && searchRuin(s, h);
      if (r) { const more = G.notices.splice(0).filter(t => t !== r.text).map(t => `<p>${esc(t)}</p>`).join(''); modal(`<h2>${r.ok ? 'The ruin gives up its secret' : 'The ruin keeps its secret'}</h2><p>${esc(r.text)}</p>${more}<div class="row"><button type="button" class="primary" data-a="ok">Continue</button></div>`); waitClick('button[data-a]').then(closeModal); }
      const again = stackById(s.id); if (again) selectStack(again); else sel = null;
    }
    else if ('prod' in d) { const c = G.cities[+d.city]; if (!setProduction(c, d.prod || null)) setHoverText(`Not enough gold for ${UNITS[d.prod].name}.`); }
    else if (d.upgrade) upgradeCity(G.cities[+d.upgrade]);
    refresh();
  });

  /* ---------- boot ---------- */
  resize(); loop();
  if (location.search.includes('auto')) {
    AUTO = true; newGame(-1); HUMAN = 0; start(); window.__done = runTurns().then(() => ({ turn: G.turn, winner: G.winner }));
  } else title();
  window.__dbg = { get G() { return G; }, centerOn, screen: (x, y) => { const r = cv.getBoundingClientRect(); return [r.left + x * TS + TS / 2 - cam.x, r.top + y * TS + TS / 2 - cam.y]; } };
})();
</script>
</body></html>
